[project]
name = "windows-tts-bot"
version = "1.0.0"
description = "Telegram bot for Windows TTS with pyttsx3"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pyttsx3>=2.90",
    "python-telegram-bot>=20.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["bot"]

[tool.setuptools.packages.find]
where = ["."]
