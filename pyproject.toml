[project]
name = "still-life-bot"
version = "1.0.0"
description = "Telegram bot for generating distorted still life images"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-telegram-bot>=20.0",
    "diffusers>=0.30.0",
    "transformers>=4.46.0",
    "pillow>=10.0.0",
    "huggingface-hub>=0.26.0",
    "accelerate>=1.1.0",
    "safetensors>=0.4.0",
    "numpy>=1.26.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
